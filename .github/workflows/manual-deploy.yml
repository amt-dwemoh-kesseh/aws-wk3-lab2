name: Manual Deploy to ECR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      image_tag:
        description: 'Image tag to deploy (leave empty for latest commit)'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: emmanuelkesseh_profile

jobs:
  manual-deploy:
    runs-on: ubuntu-latest
    name: Manual Deploy
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set image tag
      id: set-tag
      run: |
        if [ -n "${{ github.event.inputs.image_tag }}" ]; then
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
        fi
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR Public
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public
        
    - name: Build and push to ECR
      env:
        REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
        REGISTRY_ALIAS: ${{ secrets.ECR_REGISTRY_ALIAS }}
        REPOSITORY: ${{ env.ECR_REPOSITORY }}
        ENVIRONMENT: ${{ github.event.inputs.environment }}
      run: |
        # Build the Docker image
        docker build -t $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG-$ENVIRONMENT .
        docker build -t $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$ENVIRONMENT-latest .
        
        # Push the images to ECR
        docker push $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG-$ENVIRONMENT
        docker push $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$ENVIRONMENT-latest
        
        echo "Deployed to $ENVIRONMENT environment"
        echo "Image URI: $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG-$ENVIRONMENT"