name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: emmanuelkesseh_profile
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint --if-present
      
    - name: Run tests
      run: npm test --if-present

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Build and Deploy to ECR
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR Public
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public
        
    - name: Build, tag, and push image to Amazon ECR Public
      env:
        REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
        REGISTRY_ALIAS: ${{ secrets.ECR_REGISTRY_ALIAS }}
        REPOSITORY: ${{ env.ECR_REPOSITORY }}
      run: |
        # Build the Docker image
        docker build -t $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG .
        docker build -t $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:latest .
        
        # Push the images to ECR
        docker push $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG
        docker push $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:latest
        
        # Output the image URI for reference
        echo "Image URI: $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG"
        echo "Latest URI: $REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:latest"
        
    - name: Image scan
      env:
        REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
        REGISTRY_ALIAS: ${{ secrets.ECR_REGISTRY_ALIAS }}
        REPOSITORY: ${{ env.ECR_REPOSITORY }}
      run: |
        # Wait for image to be available for scanning
        sleep 30
        
        # Scan the image for vulnerabilities
        aws ecr-public describe-image-scan-findings \
          --registry-id ${{ steps.login-ecr-public.outputs.registry_id }} \
          --repository-name $REPOSITORY \
          --image-id imageTag=$IMAGE_TAG \
          --region us-east-1 || echo "Scan not available yet"

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'